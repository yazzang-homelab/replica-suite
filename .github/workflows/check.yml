name: Plugin verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Playwright 1.56 supports this image; ubuntu-latest can change underneath it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 실제 Qt offscreen 위젯 검사
        run: |
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
          python -m pip install PySide6==6.12.0
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -p test_uiux_qt.py -v
      - run: npm audit --omit=dev --audit-level=high
